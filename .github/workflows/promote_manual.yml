name: Promote Model (manual)

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model name'
        required: true
        default: 'fraud_model'
      version:
        description: 'Model version to promote'
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Promote model via DB
        env:
          ASYNC_DATABASE_URL: ${{ secrets.ASYNC_DATABASE_URL }}
        run: |
          python tools/promote_model.py "$ASYNC_DATABASE_URL" "${{ github.event.inputs.model_name }}" "${{ github.event.inputs.version }}"
